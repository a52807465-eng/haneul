[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "synthex"
version = "0.1.0"
description = "Strategy-first synthesis planning with ReactionJSON graph edits"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
authors = [
  {name = "Laboratory of Artificial Chemical Intelligence", email = "philippe.schwaller@epfl.ch"},
]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "rdkit>=2023.9.1,<2026.9",
]

[project.scripts]
synthex = "synthex.cli:main"

[project.optional-dependencies]
solar = [
  "openai>=1.30,<3",
  "httpx>=0.27",
]
report = [
  "python-docx>=1.1",
  "reportlab>=4.2",
  "pypdf>=5.0",
]
live = [
  "google-genai>=1.66,<2",
]
planner = [
  "aizynthfinder==4.4.1",
]
manuscript = [
  "aizynthfinder==4.4.1",
  "google-genai>=1.66,<2",
]
dev = [
  "aizynthfinder==4.4.1",
  "build>=1.2,<2",
  "google-genai>=1.66,<2",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synthex"]

[tool.hatch.build.targets.wheel.force-include]
"CITATION.cff" = "synthex/CITATION.cff"
"THIRD_PARTY_NOTICES.md" = "synthex/THIRD_PARTY_NOTICES.md"
"configs" = "synthex/configs"
"docs" = "synthex/docs"
"demo" = "synthex/demo"
"examples" = "synthex/examples"
"schemas" = "synthex/schemas"
"uv.lock" = "synthex/uv.lock"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/configs",
  "/examples",
  "/schemas",
  "/docs",
  "/demo",
  "/README.md",
  "/instructions.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/CITATION.cff",
  "/Dockerfile",
  "/.github",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "live: requires credentials and network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = [
  "src/synthex/agents",
  "src/synthex/artifacts.py",
  "src/synthex/config.py",
  "src/synthex/llm.py",
  "src/synthex/pipeline.py",
]
warn_unused_ignores = true
check_untyped_defs = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["aizynthfinder.*", "pandas", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*"]
follow_imports = "skip"
ignore_missing_imports = true
